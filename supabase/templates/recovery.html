<h2>Réinitialisation du mot de passe</h2>
<p>Une demande de réinitialisation du mot de passe de votre compte de la console RDC Études a été faite.</p>
<p><a href="{{ .SiteURL }}/admin/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/admin/mot-de-passe">Choisir un nouveau mot de passe</a></p>
<p>Si vous n'êtes pas à l'origine de cette demande, ignorez ce message.</p>
