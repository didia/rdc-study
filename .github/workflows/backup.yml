name: Weekly backup

# Logical dump of the production database + the private documents bucket, encrypted with a public key (only the
# owner holds the private key) and copied to a private S3-compatible bucket. Disabled until BACKUP_ENABLED=true.
# Setup and restore procedure: supabase/RESTORE.md

on:
  schedule:
    - cron: '30 3 * * 0'
  workflow_dispatch:

jobs:
  backup:
    if: ${{ vars.BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci

      - name: Install the Postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client gnupg

      - name: Dump the database
        run: |
          mkdir -p backup
          pg_dump "${{ secrets.BACKUP_DB_URL }}" --no-owner --no-privileges --schema=public --schema=auth -Fc -f backup/db.dump

      - name: Copy the documents bucket
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.BACKUP_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.BACKUP_SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/backup-storage.mjs backup/documents

      - name: Encrypt (public key only)
        run: |
          echo "${{ secrets.BACKUP_GPG_PUBLIC_KEY }}" | gpg --batch --import
          tar -C backup -czf backup.tar.gz .
          gpg --batch --yes --trust-model always --encrypt --recipient "${{ secrets.BACKUP_GPG_RECIPIENT }}" -o "rdcetudes-$(date +%F).tar.gz.gpg" backup.tar.gz

      - name: Upload to the private bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
        run: aws s3 cp rdcetudes-*.tar.gz.gpg "s3://${{ secrets.BACKUP_S3_BUCKET }}/weekly/" ${{ secrets.BACKUP_S3_ENDPOINT && format('--endpoint-url {0}', secrets.BACKUP_S3_ENDPOINT) || '' }}
